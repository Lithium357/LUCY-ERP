stage: sft
model:
  # Load the CPT adapter in the eventual training command.
  name_or_path: Qwen/Qwen3-4B-Base
  load_in_4bit: true
  quant_type: nf4
  compute_dtype: bf16
adapter:
  type: lora
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
training:
  max_sequence_length: 2048
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 0.00005
  warmup_ratio: 0.05
  scheduler: cosine
  epochs: 2
  assistant_only_loss: true
  packing: true
data:
  prepared_manifest: null
